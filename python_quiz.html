<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Python クイズ 🐍</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --surface2: #eeece7;
    --text: #1a1814;
    --text2: #6b6760;
    --border: rgba(0,0,0,0.1);
    --green-bg: #e1f5ee;
    --green-mid: #9fe1cb;
    --green-dark: #085041;
    --green-text: #04342c;
    --red-bg: #fcebeb;
    --red-mid: #f7c1c1;
    --red-dark: #501313;
    --accent: #1D9E75;
    --radius: 14px;
    --radius-sm: 9px;
  }

  body {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0;
  }

  #app {
    width: 100%;
    max-width: 480px;
    min-height: 100dvh;
    background: var(--bg);
    padding: 24px 20px 40px;
  }

  /* ── ホーム ── */
  .home-hero {
    text-align: center;
    padding: 48px 0 32px;
  }
  .home-hero .snake { font-size: 56px; margin-bottom: 12px; }
  .home-hero h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
  .home-hero p  { font-size: 14px; color: var(--text2); margin-bottom: 32px; }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    border: 1px solid var(--border);
  }
  .stat-card .num { font-size: 28px; font-weight: 700; font-family: 'DM Mono', monospace; }
  .stat-card .label { font-size: 12px; color: var(--text2); margin-top: 4px; }

  /* ── ボタン ── */
  .btn-primary {
    display: block; width: 100%;
    padding: 16px;
    background: var(--text);
    color: var(--bg);
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: opacity .15s, transform .1s;
  }
  .btn-primary:active { opacity: .85; transform: scale(.98); }

  .btn-ghost {
    display: block; width: 100%;
    padding: 14px;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: background .12s, transform .1s;
  }
  .btn-ghost:active { background: var(--surface2); transform: scale(.98); }

  .btn-back {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 13px;
    color: var(--text2);
    padding: 6px 12px;
    cursor: pointer;
  }

  /* ── クイズ ── */
  .quiz-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .progress-wrap {
    flex: 1;
    height: 5px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }
  #progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width .4s ease;
  }
  #q-counter {
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    color: var(--text2);
    white-space: nowrap;
  }

  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 14px;
  }
  .q-cat {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .q-text { font-size: 17px; font-weight: 500; line-height: 1.6; }
  .q-code {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-top: 14px;
    white-space: pre-wrap;
    display: none;
    line-height: 1.7;
  }

  .choices { display: flex; flex-direction: column; gap: 9px; }
  .choice-btn {
    width: 100%;
    padding: 14px 16px;
    text-align: left;
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    line-height: 1.5;
    transition: background .12s, border-color .12s, transform .08s;
  }
  .choice-btn:active:not(:disabled) { transform: scale(.98); }
  .choice-btn:disabled { cursor: default; }
  .choice-btn.correct {
    background: var(--green-bg);
    border-color: var(--accent);
    color: var(--green-text);
    font-weight: 500;
  }
  .choice-btn.wrong {
    background: var(--red-bg);
    border-color: #E24B4A;
    color: var(--red-dark);
  }

  /* ── 解説 ── */
  .feedback {
    display: none;
    margin-top: 14px;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid transparent;
    animation: slideUp .2s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .feedback.ok  { background: var(--green-bg); border-color: #5dcaa5; }
  .feedback.ng  { background: var(--red-bg);   border-color: #f09595; }

  .fb-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 16px;
  }
  .feedback.ok .fb-header { background: var(--green-mid); }
  .feedback.ng .fb-header { background: var(--red-mid); }

  .fb-icon  { font-size: 18px; }
  .fb-title { font-size: 14px; font-weight: 700; }
  .feedback.ok .fb-title { color: var(--green-text); }
  .feedback.ng .fb-title { color: var(--red-dark); }

  .fb-body  { padding: 12px 16px 14px; }
  .fb-exp   { font-size: 14px; line-height: 1.75; }
  .feedback.ok .fb-exp { color: var(--green-text); }
  .feedback.ng .fb-exp { color: var(--red-dark); }

  .fb-code {
    font-family: 'DM Mono', monospace;
    font-size: 12.5px;
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin-top: 10px;
    white-space: pre-wrap;
    line-height: 1.7;
    display: none;
  }
  .feedback.ok .fb-code { background: #c5ead8; color: var(--green-text); }
  .feedback.ng .fb-code { background: #f7c1c1; color: var(--red-dark); }

  #next-btn { margin-top: 14px; }

  /* ── リザルト ── */
  .result-wrap { text-align: center; padding: 48px 0 32px; }
  .result-wrap .emoji { font-size: 64px; margin-bottom: 12px; }
  .result-wrap h2 { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
  .result-score {
    font-size: 48px;
    font-weight: 700;
    font-family: 'DM Mono', monospace;
    margin: 16px 0;
    letter-spacing: -1px;
  }
  .result-msg { font-size: 15px; color: var(--text2); margin-bottom: 32px; line-height: 1.6; }
  .result-wrap .btn-primary { margin-bottom: 10px; }

  /* ── hidden ── */
  .screen { display: none; }
  .screen.active { display: block; }
</style>
</head>
<body>
<div id="app">

  <!-- ホーム -->
  <div id="home-screen" class="screen active">
    <div class="home-hero">
      <div class="snake">🐍</div>
      <h1>Python クイズ</h1>
      <p>初歩レベル・50問プール（毎回10問ランダム出題）</p>
    </div>
    <div class="stat-grid">
      <div class="stat-card">
        <div class="num" id="stat-correct">0</div>
        <div class="label">正解数（累計）</div>
      </div>
      <div class="stat-card">
        <div class="num" id="stat-total">0</div>
        <div class="label">解いた問題数</div>
      </div>
    </div>
    <button class="btn-primary" onclick="startQuiz()">はじめる →</button>
  </div>

  <!-- クイズ -->
  <div id="quiz-screen" class="screen">
    <div class="quiz-top">
      <button class="btn-back" onclick="goHome()">← 戻る</button>
      <div class="progress-wrap"><div id="progress-bar" style="width:0%"></div></div>
      <span id="q-counter">1/10</span>
    </div>

    <div class="q-card">
      <div class="q-cat" id="q-category"></div>
      <div class="q-text" id="q-text"></div>
      <pre class="q-code" id="q-code"></pre>
    </div>

    <div class="choices" id="choices"></div>

    <div class="feedback" id="feedback-box">
      <div class="fb-header">
        <span class="fb-icon" id="fb-icon"></span>
        <span class="fb-title" id="fb-title"></span>
      </div>
      <div class="fb-body">
        <div class="fb-exp" id="fb-exp"></div>
        <pre class="fb-code" id="fb-code"></pre>
      </div>
    </div>

    <button class="btn-primary" id="next-btn" style="display:none" onclick="nextQuestion()">次の問題 →</button>
  </div>

  <!-- リザルト -->
  <div id="result-screen" class="screen">
    <div class="result-wrap">
      <div class="emoji" id="result-emoji">🎉</div>
      <h2>お疲れさまでした！</h2>
      <div class="result-score" id="result-score">0/10</div>
      <p class="result-msg" id="result-msg"></p>
      <button class="btn-primary" onclick="startQuiz()">もう一度チャレンジ →</button>
      <button class="btn-ghost" onclick="goHome()">ホームへ戻る</button>
    </div>
  </div>

</div>

<script>
const ALL_QUESTIONS = [
  /* ── 変数・型 ── */
  {cat:"変数・型", q:"Pythonで整数を文字列に変換する関数は？",
   code:null, choices:["str()","int()","float()","chr()"], ans:0,
   exp:"str() は値を文字列に変換します。",
   expCode:"str(42)   # → '42'\nstr(3.14) # → '3.14'"},
  {cat:"変数・型", q:"次のコードを実行すると何が表示される？",
   code:"x = 10\ny = 3\nprint(x // y)", choices:["3","3.33","4","30"], ans:0,
   exp:"// は切り捨て除算（整数除算）です。小数部分を切り捨てて整数を返します。",
   expCode:"10 // 3  # → 3\n10 / 3   # → 3.333...（通常の割り算）"},
  {cat:"変数・型", q:"type(3.14) の結果は？",
   code:null, choices:["<class 'float'>","<class 'int'>","<class 'str'>","<class 'number'>"], ans:0,
   exp:"3.14 は小数（float型）です。type() で型を確認できます。",
   expCode:"type(3.14)  # → <class 'float'>\ntype(3)     # → <class 'int'>"},
  {cat:"変数・型", q:"Python でコメントを書くときに使う記号は？",
   code:null, choices:["#","//","/*","--"], ans:0,
   exp:"# を行の先頭または途中に書くと、それ以降はコメントとして無視されます。",
   expCode:"# これはコメントです\nx = 10  # ここもコメント"},
  {cat:"変数・型", q:"次の出力は何？",
   code:"print(2 ** 3)", choices:["8","6","9","23"], ans:0,
   exp:"** はべき乗演算子です。2 ** 3 は 2の3乗 = 8 です。",
   expCode:"2 ** 3   # → 8\n2 ** 10  # → 1024"},
  {cat:"変数・型", q:"10 % 3 の結果は？",
   code:null, choices:["1","3","0","10"], ans:0,
   exp:"% は剰余（余り）演算子です。10 ÷ 3 = 3 余り 1 なので結果は 1 です。",
   expCode:"10 % 3  # → 1\n7 % 2   # → 1\n6 % 2   # → 0"},
  {cat:"変数・型", q:"Pythonで変数に値を代入する記号は？",
   code:null, choices:["=","==","=>","<-"], ans:0,
   exp:"= は代入演算子です。== は等値比較に使います。",
   expCode:"x = 10   # 代入\nx == 10  # 比較（True/Falseを返す）"},
  {cat:"変数・型", q:"次のコードの出力は？",
   code:"x = 5\nx += 3\nprint(x)", choices:["8","5","3","53"], ans:0,
   exp:"+= は複合代入演算子で、x += 3 は x = x + 3 と同じ意味です。",
   expCode:"x = 5\nx += 3   # x = x + 3\nprint(x) # → 8"},
  {cat:"変数・型", q:"文字列をfloatに変換する関数は？",
   code:null, choices:["float()","str()","int()","num()"], ans:0,
   exp:"float() は文字列や整数を浮動小数点数（小数）に変換します。",
   expCode:"float('3.14')  # → 3.14\nfloat(5)       # → 5.0"},

  /* ── 文字列 ── */
  {cat:"文字列", q:"文字列 'Hello' の長さを返すコードは？",
   code:null, choices:["len('Hello')","'Hello'.length","size('Hello')","count('Hello')"], ans:0,
   exp:"len() は文字列・リスト・辞書などの要素数を返す組み込み関数です。",
   expCode:"len('Hello')   # → 5\nlen([1,2,3])  # → 3"},
  {cat:"文字列", q:"次のコードの出力は？",
   code:"s = 'Python'\nprint(s[0])", choices:["P","y","Python","p"], ans:0,
   exp:"文字列はインデックスで1文字ずつアクセスできます。インデックスは 0 から始まります。",
   expCode:"s = 'Python'\ns[0]  # → 'P'\ns[1]  # → 'y'\ns[-1] # → 'n'（末尾）"},
  {cat:"文字列", q:"文字列を大文字に変換するメソッドは？",
   code:null, choices:["upper()","toUpper()","capitalize()","big()"], ans:0,
   exp:"upper() はすべての文字を大文字にします。小文字にするには lower() を使います。",
   expCode:"'hello'.upper()  # → 'HELLO'\n'HELLO'.lower()  # → 'hello'"},
  {cat:"文字列", q:"次のコードの出力は？",
   code:"print('Hello' + ' ' + 'World')", choices:["Hello World","HelloWorld","Hello+World","エラー"], ans:0,
   exp:"+ 演算子で文字列を連結できます（文字列の結合）。",
   expCode:"'Hello' + ' ' + 'World'  # → 'Hello World'"},
  {cat:"文字列", q:"文字列の前後の空白を除去するメソッドは？",
   code:null, choices:["strip()","trim()","remove()","clean()"], ans:0,
   exp:"strip() は文字列の先頭・末尾の空白や改行を取り除きます。",
   expCode:"'  hello  '.strip()   # → 'hello'\n'  hello  '.lstrip()  # → 'hello  '（左のみ）"},
  {cat:"文字列", q:"f文字列の正しい書き方は？",
   code:null, choices:["f'名前は{name}です'","'名前は{name}です'","f'名前は(name)です'","`名前は${name}です`"], ans:0,
   exp:"f文字列（fストリング）は f'...' の形式で変数を {} で埋め込めます。",
   expCode:"name = 'Taro'\nprint(f'名前は{name}です')  # → 名前はTaroです"},
  {cat:"文字列", q:"文字列を特定の文字で分割するメソッドは？",
   code:null, choices:["split()","divide()","cut()","slice()"], ans:0,
   exp:"split() は指定した区切り文字で文字列をリストに分割します。",
   expCode:"'a,b,c'.split(',')   # → ['a', 'b', 'c']\n'hello world'.split() # → ['hello', 'world']"},

  /* ── リスト ── */
  {cat:"リスト", q:"リストの末尾に要素を追加するメソッドは？",
   code:null, choices:["append()","add()","insert()","push()"], ans:0,
   exp:"append() でリストの末尾に要素を追加します。",
   expCode:"lst = [1, 2, 3]\nlst.append(4)\nprint(lst)  # → [1, 2, 3, 4]"},
  {cat:"リスト", q:"次のコードの出力は？",
   code:"nums = [1, 2, 3, 4, 5]\nprint(nums[1:3])", choices:["[2, 3]","[1, 2, 3]","[2, 3, 4]","[1, 2]"], ans:0,
   exp:"スライス [start:end] は start以上 end未満の要素を返します。",
   expCode:"nums = [1, 2, 3, 4, 5]\nnums[1:3]  # → [2, 3]（index 1, 2）"},
  {cat:"リスト", q:"リストの要素数を返す関数は？",
   code:null, choices:["len()","count()","size()","length()"], ans:0,
   exp:"len() はリスト・文字列・辞書などの要素数を返します。",
   expCode:"len([1, 2, 3])  # → 3\nlen([])         # → 0"},
  {cat:"リスト", q:"リストから末尾の要素を取り出して削除するメソッドは？",
   code:null, choices:["pop()","remove()","delete()","clear()"], ans:0,
   exp:"pop() はリストの末尾の要素を取り出し、同時にリストから削除します。",
   expCode:"lst = [1, 2, 3]\nx = lst.pop()\nprint(x)    # → 3\nprint(lst)  # → [1, 2]"},
  {cat:"リスト", q:"次のコードの出力は？",
   code:"lst = [3, 1, 2]\nlst.sort()\nprint(lst)", choices:["[1, 2, 3]","[3, 1, 2]","[3, 2, 1]","エラー"], ans:0,
   exp:"sort() はリストを昇順に並び替えます（元のリストを直接変更します）。",
   expCode:"lst = [3, 1, 2]\nlst.sort()         # 昇順\nprint(lst)         # → [1, 2, 3]\nlst.sort(reverse=True)  # 降順"},
  {cat:"リスト", q:"リストを逆順にするメソッドは？",
   code:null, choices:["reverse()","invert()","flip()","sort(desc=True)"], ans:0,
   exp:"reverse() はリストの順番を逆にします（元のリストを直接変更します）。",
   expCode:"lst = [1, 2, 3]\nlst.reverse()\nprint(lst)  # → [3, 2, 1]"},
  {cat:"リスト", q:"次のコードの出力は？",
   code:"lst = [10, 20, 30]\nprint(lst[-1])", choices:["30","10","20","エラー"], ans:0,
   exp:"負のインデックスは末尾から数えます。-1 は最後の要素、-2 はその前の要素です。",
   expCode:"lst = [10, 20, 30]\nlst[-1]  # → 30（最後）\nlst[-2]  # → 20"},

  /* ── 辞書 ── */
  {cat:"辞書", q:"辞書（dict）を作る正しい書き方は？",
   code:null, choices:['{"key": "value"}','["key": "value"]','("key", "value")','<key: value>'], ans:0,
   exp:"{} を使って辞書を定義します。キーと値を : で区切り、複数の場合は , で並べます。",
   expCode:'d = {"name": "Taro", "age": 25}\nprint(d["name"])  # → Taro'},
  {cat:"辞書", q:"辞書のすべてのキーを取得するメソッドは？",
   code:null, choices:["keys()","values()","items()","get()"], ans:0,
   exp:"keys() はすべてのキーをビューオブジェクトとして返します。list() でリスト化できます。",
   expCode:'d = {"a": 1, "b": 2}\nlist(d.keys())    # → [\'a\', \'b\']\nlist(d.values())  # → [1, 2]'},
  {cat:"辞書", q:"辞書のキーが存在しないとき None を返すメソッドは？",
   code:null, choices:["get()","find()","fetch()","search()"], ans:0,
   exp:"get() はキーが存在しなければ None（またはデフォルト値）を返します。d[key] はKeyErrorになります。",
   expCode:'d = {"a": 1}\nd.get("a")       # → 1\nd.get("b")       # → None\nd.get("b", 0)    # → 0（デフォルト値）'},
  {cat:"辞書", q:"次のコードの出力は？",
   code:'d = {"x": 10, "y": 20}\nd["z"] = 30\nprint(len(d))', choices:["3","2","1","エラー"], ans:0,
   exp:"辞書に新しいキーを代入すると要素が追加されます。len() で要素数を取得できます。",
   expCode:'d = {"x": 10}\nd["y"] = 20\nprint(len(d))  # → 2'},

  /* ── 条件分岐 ── */
  {cat:"条件分岐", q:"Pythonの条件式で正しく書かれているのは？",
   code:null, choices:["if x == 10:","if x = 10:","if (x == 10)","if x === 10:"], ans:0,
   exp:"== で等値比較し、if文の末尾に : が必要です。= は代入、=== はJavaScriptの書き方です。",
   expCode:"x = 10\nif x == 10:\n    print('ten')  # → ten"},
  {cat:"条件分岐", q:"if/elif/else の elif は何の略？",
   code:null, choices:["else if","else/if","else in","elif は略ではない"], ans:0,
   exp:"elif は 'else if' の短縮形です。複数の条件を順番に評価できます。",
   expCode:"x = 5\nif x > 10:\n    print('大きい')\nelif x > 3:\n    print('中くらい')  # → これが実行\nelse:\n    print('小さい')"},
  {cat:"条件分岐", q:"次のコードの出力は？",
   code:"x = 15\nif x > 10:\n    print('A')\nelse:\n    print('B')", choices:["A","B","AB","エラー"], ans:0,
   exp:"x = 15 は 10 より大きいので if ブロックが実行され 'A' が表示されます。",
   expCode:"x = 15\nif x > 10:\n    print('A')  # → A（こちらが実行）\nelse:\n    print('B')"},
  {cat:"条件分岐", q:"'and' 演算子の意味は？",

let questions = [], current = 0, score = 0;
let totalCorrect = 0, totalDone = 0;

try {
  totalCorrect = parseInt(localStorage.getItem('pyq_correct') || '0');
  totalDone    = parseInt(localStorage.getItem('pyq_done')    || '0');
} catch(e){}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  questions = shuffle(ALL_QUESTIONS).slice(0, 10);
  current = 0; score = 0;
  show('quiz-screen');
  loadQuestion();
}

function loadQuestion() {
  const q = questions[current];
  document.getElementById('q-counter').textContent = `${current + 1}/10`;
  document.getElementById('progress-bar').style.width = `${current * 10}%`;
  document.getElementById('q-category').textContent = q.cat;
  document.getElementById('q-text').textContent = q.q;

  const codeEl = document.getElementById('q-code');
  if (q.code) { codeEl.textContent = q.code; codeEl.style.display = 'block'; }
  else         { codeEl.style.display = 'none'; }

  const correctText = q.choices[q.ans];
  const shuffled = shuffle(q.choices);
  const container = document.getElementById('choices');
  container.innerHTML = '';
  shuffled.forEach(text => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = text;
    btn.dataset.correct = text === correctText ? '1' : '0';
    btn.onclick = () => selectAnswer(btn, text, correctText, q.exp, q.expCode);
    container.appendChild(btn);
  });

  const fb = document.getElementById('feedback-box');
  fb.style.display = 'none';
  fb.className = 'feedback';
  document.getElementById('next-btn').style.display = 'none';
}

function selectAnswer(btn, selected, correct, exp, expCode) {
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
  const isCorrect = selected === correct;

  if (isCorrect) {
    score++;
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.choice-btn').forEach(b => {
      if (b.dataset.correct === '1') b.classList.add('correct');
    });
  }

  const fb    = document.getElementById('feedback-box');
  const icon  = document.getElementById('fb-icon');
  const title = document.getElementById('fb-title');
  const expEl = document.getElementById('fb-exp');
  const code  = document.getElementById('fb-code');

  fb.className = 'feedback ' + (isCorrect ? 'ok' : 'ng');
  icon.textContent  = isCorrect ? '✓' : '✗';
  title.textContent = isCorrect ? '正解！' : `不正解　　正解：${correct}`;
  expEl.textContent = exp;

  if (expCode) { code.textContent = expCode; code.style.display = 'block'; }
  else         { code.style.display = 'none'; }

  fb.style.display = 'block';

  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = current < 9 ? '次の問題 →' : '結果を見る →';
}

function nextQuestion() {
  current++;
  if (current >= 10) showResult();
  else loadQuestion();
}

function showResult() {
  totalCorrect += score;
  totalDone    += 10;
  try {
    localStorage.setItem('pyq_correct', totalCorrect);
    localStorage.setItem('pyq_done',    totalDone);
  } catch(e){}
  updateStats();

  document.getElementById('result-score').textContent = `${score}/10`;
  const pct = score / 10;
  let emoji, msg;
  if (pct === 1)      { emoji = '🏆'; msg = '満点！完璧です。この調子で次のレベルへ！'; }
  else if (pct >= .7) { emoji = '🎉'; msg = 'よくできました！少しずつ積み上げていきましょう。'; }
  else if (pct >= .4) { emoji = '💪'; msg = 'いい調子です。間違えた問題をもう一度確認しましょう。'; }
  else                { emoji = '📖'; msg = '基礎から少しずつ練習しましょう。繰り返しが大切です！'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-msg').textContent   = msg;
  show('result-screen');
}

function updateStats() {
  document.getElementById('stat-correct').textContent = totalCorrect;
  document.getElementById('stat-total').textContent   = totalDone;
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome() { updateStats(); show('home-screen'); }

updateStats();
